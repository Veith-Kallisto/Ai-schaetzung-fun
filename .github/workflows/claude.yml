# Claude per Kommentar starten: In einem Issue oder Pull Request "@claude <Aufgabe>" schreiben
# (geht auch aus der GitHub-App am Handy). Voraussetzungen, einmalig:
#   1. Claude GitHub App installieren: https://github.com/apps/claude  (Zugriff auf dieses Repo geben)
#   2. Secret anlegen (Settings → Secrets and variables → Actions):
#      - CLAUDE_CODE_OAUTH_TOKEN  (Claude Pro/Max: lokal `claude setup-token` ausführen)   ODER
#      - ANTHROPIC_API_KEY        (API-Key von https://platform.claude.com)
#   3. Diese Datei muss auf dem Default-Branch (main) liegen, sonst reagiert sie nicht auf Kommentare.
# Doku: https://code.claude.com/docs/en/github-actions
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Eines von beiden verwenden – das andere Secret einfach nicht anlegen:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
