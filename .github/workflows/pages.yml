# Veröffentlicht index.html auf GitHub Pages.
# Einmalig aktivieren: Repo → Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# Danach ist die App unter https://veith-kallisto.github.io/Ai-schaetzung-fun/ erreichbar.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # versucht, Pages automatisch zu aktivieren (sonst einmalig in den Settings)
      - name: Nur die fertige App hochladen
        run: mkdir -p _site && cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
