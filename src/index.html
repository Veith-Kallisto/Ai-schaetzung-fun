<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jini Schätz-Orakel</title>
<meta name="description" content="Jini, der Dschinn, schätzt deinen Projektaufwand – mit echten 3D-Würfeln. Nur zum Spaß.">
<meta name="theme-color" content="#0b0a1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b0a1f'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle'%3E%F0%9F%A7%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,700;1,9..144,900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/*__INLINE_CSS__*/
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="who">
      <span class="avatar" aria-hidden="true"><span class="avatar-emoji">🧞</span></span>
      <div class="who-text">
        <h1 class="name">Jini</h1>
        <p class="status"><span class="dot" aria-hidden="true"></span><span id="status-text">Schätz-Orakel · online · Konfidenz 100 %</span></p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-sound" type="button" aria-label="Ton aus" aria-pressed="true" title="Ton an/aus">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path class="mute" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-reset" type="button" aria-label="Neuer Chat" title="Neuer Chat">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Jinis Würfelbühne">
    <div class="stage-canvas" id="stage-canvas"></div>
    <div class="stage-glow" aria-hidden="true"></div>
    <div class="genie-wrap" id="genie"><!--__GENIE__--></div>
    <div class="stage-caption" id="stage-caption" aria-live="polite">Die Würfel des Schicksals ruhen.</div>
    <div class="stage-flash" id="stage-flash" aria-hidden="true"></div>
  </section>

  <main class="chat">
    <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="chips" id="chips" aria-label="Vorschläge"></div>
    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="prompt">Was soll Jini schätzen?</label>
      <textarea id="prompt" name="prompt" rows="1" placeholder="Was soll Jini schätzen?" enterkeyhint="send"></textarea>
      <button class="send" id="btn-send" type="submit" aria-label="Schätzen lassen">
        <span class="send-label">Würfeln</span>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11.5 20.5 4l-5 17-3.7-6.8L3 11.5z" fill="currentColor"/></svg>
      </button>
    </form>
    <p class="disclaimer">Nur zum Spaß. Keine Haftung. Trotzdem genauer als das letzte Planning Poker.</p>
  </main>
</div>
<script>
/*__INLINE_JS__*/
</script>
</body>
</html>
