<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jini Schätz-Orakel</title>
<meta name="description" content="Jini, der Dschinn, schätzt deinen Projektaufwand – mit echten 3D-Würfeln. Nur zum Spaß.">
<meta name="theme-color" content="#0b0a1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b0a1f'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle'%3E%F0%9F%A7%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,700;1,9..144,900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Jini – Schätz-Orakel. Bewusst einfarbig dunkel: eine Nacht in der Lampe. */
:root {
  color-scheme: dark;
  --bg: #0b0a1f;
  --bg-2: #120f2c;
  --surface: #1a1638;
  --surface-2: #241d4c;
  --glass: rgba(255, 255, 255, 0.05);
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.17);
  --text: #f1ebdd;
  --muted: #9c96c2;
  --gold: #f5b84b;
  --gold-deep: #c98a1e;
  --gold-soft: rgba(245, 184, 75, 0.16);
  --violet: #8b6cff;
  --violet-deep: #5b3fe0;
  --teal: #2dd4bf;
  --magenta: #ff4d8d;
  --ok: #3ddc84;
  --font-display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-body: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button { font: inherit; }

/* ---------- Grundgerüst ---------- */
.app {
  display: grid;
  height: 100vh;
  height: 100dvh;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(230px, 36vh) minmax(0, 1fr);
  grid-template-areas: 'top' 'stage' 'chat';
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(139, 108, 255, 0.14), transparent 60%),
    var(--bg);
}
@media (min-width: 900px) {
  .app {
    grid-template-columns: minmax(420px, 1fr) minmax(380px, 46%);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: 'top stage' 'chat stage';
  }
}

/* ---------- Kopfzeile ---------- */
.topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(11, 10, 31, 0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 2;
}
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar {
  flex: 0 0 auto;
  width: 42px; height: 42px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(145deg, #7a5cf5, #3d2aa3);
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold);
  font-size: 22px;
}
.avatar-emoji { translate: 0 1px; }
.who-text { min-width: 0; }
.status > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.name {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 24px;
  line-height: 1.05;
  letter-spacing: -0.01em;
  font-variation-settings: 'opsz' 144;
}
.status {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dot {
  flex: 0 0 auto;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ok);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.55); }
  70% { box-shadow: 0 0 0 7px rgba(61, 220, 132, 0); }
  100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); }
}
.topbar-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--glass);
  color: var(--text);
  display: grid; place-items: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
}
.icon-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn .mute { display: none; }
.icon-btn.is-muted .wave { display: none; }
.icon-btn.is-muted .mute { display: block; }

/* ---------- Bühne ---------- */
.stage {
  grid-area: stage;
  position: relative;
  overflow: hidden;
  min-height: 0;
  background: radial-gradient(ellipse 90% 70% at 50% 110%, #2a2352 0%, #161238 45%, #0b0a1f 100%);
  border-bottom: 1px solid var(--line);
}
@media (min-width: 900px) {
  .stage { border-bottom: 0; border-left: 1px solid var(--line); }
}
.stage-canvas { position: absolute; inset: 0; }
.stage-canvas canvas { display: block; width: 100% !important; height: 100% !important; }
.stage.no-webgl .stage-canvas { display: none; }

.genie-wrap {
  position: absolute;
  left: 3%;
  top: 2%;
  width: clamp(112px, 26vw, 156px);
  pointer-events: none;
  filter: drop-shadow(0 14px 26px rgba(91, 63, 224, 0.45));
  z-index: 1;
}
@media (min-width: 900px) {
  .genie-wrap { left: 50%; top: 3%; width: clamp(190px, 36%, 270px); translate: -50% 0; }
}
.genie { width: 100%; height: auto; display: block; animation: float 3.8s ease-in-out infinite; transform-origin: 50% 88%; }
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-9px) rotate(1.5deg); }
}
.genie .tail { transform-origin: 137px 240px; animation: sway 4.5s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.genie .puff { transform-box: fill-box; transform-origin: center; animation: puff 3s ease-in-out infinite; }
.genie .p2 { animation-delay: -1s; }
.genie .p3 { animation-delay: -2s; }
@keyframes puff {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
  50% { transform: translateY(-7px) scale(1.3); opacity: 0.18; }
}
.genie .eyes { transform-origin: 160px 80px; animation: blink 5.2s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
.genie .lamp-glow { transform-origin: 74px 288px; animation: lampglow 2.6s ease-in-out infinite; }
@keyframes lampglow { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
.genie .spark { transform-box: fill-box; transform-origin: center; animation: spark 2.8s ease-in-out infinite; }
.genie .s2 { animation-delay: -0.7s; }
.genie .s3 { animation-delay: -1.4s; }
.genie .s4 { animation-delay: -2.1s; }
@keyframes spark {
  0%, 100% { opacity: 0; transform: scale(0.4) translateY(0); }
  50% { opacity: 1; transform: scale(1.3) translateY(-7px); }
}
.genie .aura { transform-origin: 160px 115px; animation: aura 3.4s ease-in-out infinite; }
@keyframes aura { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
.genie .brow, .genie .pupils { transition: transform 0.35s var(--ease-out); }
.genie .brow-l { transform-origin: 146px 66px; }
.genie .brow-r { transform-origin: 174px 66px; }
.genie .mouth-grin, .genie .mouth-teeth, .genie .mouth-sad, .genie .mouth-o { display: none; }

/* Zustände des Dschinns */
.genie-wrap.thinking .brow-l { transform: translateY(-4px) rotate(-9deg); }
.genie-wrap.thinking .brow-r { transform: translateY(-2px) rotate(7deg); }
.genie-wrap.thinking .pupils { transform: translate(3px, -3px); }
.genie-wrap.thinking .genie { animation: think 1.2s ease-in-out infinite; }
.genie-wrap.thinking .puff { animation-duration: 1.1s; }
.genie-wrap.thinking .tail { animation-duration: 1.4s; }
@keyframes think { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }

.genie-wrap.rolling .genie { animation: wobble 0.5s ease-in-out infinite; }
.genie-wrap.rolling .mouth-smile { display: none; }
.genie-wrap.rolling .mouth-o { display: block; }
.genie-wrap.rolling .pupils { transform: translate(0, 4px); }
@keyframes wobble {
  0%, 100% { transform: rotate(-7deg) scale(1.03); }
  50% { transform: rotate(7deg) scale(0.97); }
}

.genie-wrap.reveal .genie { animation: reveal-pop 0.9s var(--ease-pop) both; }
.genie-wrap.reveal .mouth-smile { display: none; }
.genie-wrap.reveal .mouth-grin, .genie-wrap.reveal .mouth-teeth { display: block; }
.genie-wrap.reveal .aura { animation: aura-burst 0.9s ease-out both; }
@keyframes reveal-pop {
  0% { transform: scale(0.92); }
  45% { transform: scale(1.14) translateY(-12px); }
  100% { transform: scale(1); }
}
@keyframes aura-burst { 0% { opacity: 1; transform: scale(0.9); } 100% { opacity: 0.7; transform: scale(1.6); } }

.genie-wrap.sad .genie { animation: sad-sink 1.2s ease-out both; }
.genie-wrap.sad .mouth-smile { display: none; }
.genie-wrap.sad .mouth-sad { display: block; }
.genie-wrap.sad .brow-l { transform: translateY(2px) rotate(14deg); }
.genie-wrap.sad .brow-r { transform: translateY(2px) rotate(-14deg); }
@keyframes sad-sink { 0% { transform: translateY(0); } 100% { transform: translateY(10px) rotate(-3deg); } }

.stage-glow {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 60% 55% at 50% 100%, rgba(245, 184, 75, 0.38), transparent 70%);
  opacity: 0;
  transition: opacity 0.6s ease;
}
.stage.rolling .stage-glow, .stage.thinking .stage-glow { opacity: 1; }
.stage-flash {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 60%, rgba(255, 226, 160, 0.9), rgba(245, 184, 75, 0.25) 40%, transparent 70%);
  opacity: 0;
}
.stage.flash .stage-flash { animation: flash 0.7s ease-out both; }
@keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
.stage.shake .stage-canvas { animation: shake 0.18s linear; }
@keyframes shake {
  0% { transform: translate(0, 0); }
  25% { transform: translate(3px, -2px); }
  50% { transform: translate(-3px, 2px); }
  75% { transform: translate(2px, 1px); }
  100% { transform: translate(0, 0); }
}
.stage-caption {
  position: absolute; left: 50%; bottom: 10px; translate: -50% 0;
  max-width: 92%;
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
  background: rgba(11, 10, 31, 0.6);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 1;
  transition: color 0.3s;
}
.stage.rolling .stage-caption { color: var(--gold); }

/* ---------- Chat ---------- */
.chat { grid-area: chat; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.messages {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto;
  padding: 18px 16px 8px;
  display: flex; flex-direction: column; gap: 14px;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--surface-2) transparent;
  overscroll-behavior: contain;
}
.msg { display: flex; align-items: flex-end; gap: 10px; max-width: min(88%, 680px); animation: msg-in 0.32s var(--ease-out) both; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.genie { align-self: flex-start; }
.msg.wide { max-width: min(100%, 720px); }
@keyframes msg-in { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
.mini {
  flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(145deg, #7a5cf5, #3d2aa3);
  display: grid; place-items: center; font-size: 17px;
  box-shadow: 0 0 0 2px rgba(139, 108, 255, 0.25);
}
.bubble { padding: 11px 15px; border-radius: 18px; min-width: 0; overflow-wrap: anywhere; }
.msg.genie .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.user .bubble { background: linear-gradient(135deg, #3b2f78, #2a2254); border: 1px solid rgba(245, 184, 75, 0.28); border-bottom-right-radius: 6px; }
.msg.wide .bubble { flex: 1 1 auto; }
.bubble p { margin: 0 0 6px; }
.bubble p:last-child { margin: 0; }
.bubble b { color: var(--gold); font-weight: 800; }

.typing { display: flex; align-items: center; gap: 10px; min-height: 22px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--violet); animation: dotbounce 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dotbounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-5px); opacity: 1; } }
.thinking-line { color: var(--muted); font-style: italic; font-family: var(--font-display); font-size: 15px; animation: line-in 0.35s var(--ease-out) both; }
@keyframes line-in { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }

/* Ergebniskarte */
.card { display: flex; flex-direction: column; gap: 12px; padding: 2px 0 0; }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.dice-chips { display: inline-flex; gap: 6px; }
.die-chip {
  display: inline-grid; place-items: center;
  width: 34px; height: 34px; border-radius: 9px;
  background: #f6ecd6; color: #1b1740;
  font-size: 29px; line-height: 1;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15), 0 4px 10px rgba(0, 0, 0, 0.35);
  animation: chip-in 0.5s var(--ease-pop) both;
}
.die-chip + .die-chip { animation-delay: 0.1s; }
@keyframes chip-in { from { transform: rotate(-30deg) scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
.factors { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12.5px; }
.factors td { padding: 5px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
.factors td:last-child { text-align: right; white-space: nowrap; color: var(--gold); font-weight: 700; padding-left: 12px; font-variant-numeric: tabular-nums; }
.factors tr { animation: msg-in 0.3s var(--ease-out) both; }
.factors tr.total td { border-bottom: 0; border-top: 1px solid var(--line-strong); color: var(--text); font-weight: 700; }
.factors tr.total td:last-child { color: var(--text); }
.result { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 128px 2px 0; min-height: 64px; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.num {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(46px, 9vw, 66px);
  line-height: 1;
  color: var(--gold);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 144;
  text-shadow: 0 0 24px rgba(245, 184, 75, 0.45), 0 2px 0 rgba(0, 0, 0, 0.35);
}
.unit { font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 13px; color: var(--text); }
.approx { font-size: 13px; color: var(--muted); }
.verdict { margin: 0; font-family: var(--font-display); font-style: italic; font-size: 16.5px; line-height: 1.4; text-wrap: balance; }
.seal {
  position: absolute; right: 0; top: 8px;
  rotate: -12deg;
  font-family: var(--font-mono); font-weight: 700; font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--magenta);
  border: 2.5px solid var(--magenta);
  border-radius: 6px;
  padding: 4px 8px;
  box-shadow: inset 0 0 0 1.5px var(--surface), inset 0 0 0 3px var(--magenta);
  opacity: 0;
  animation: stamp 0.45s var(--ease-pop) forwards;
  animation-delay: var(--stamp-delay, 1.2s);
  max-width: 120px; text-align: center;
}
@keyframes stamp {
  0% { opacity: 0; transform: scale(2.6); }
  60% { opacity: 1; transform: scale(0.94); }
  100% { opacity: 1; transform: scale(1); }
}
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font-weight: 700; font-size: 13px;
  color: var(--text);
  background: var(--glass);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 7px 12px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
}
.btn:hover { border-color: var(--gold); background: var(--gold-soft); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: linear-gradient(135deg, #ffd06a, #e39a2a); color: #1b1740; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }

/* Vorschläge */
.chips {
  flex: 0 0 auto;
  display: flex; gap: 8px;
  overflow-x: auto;
  padding: 6px 16px 10px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }
.chips:empty { display: none; }
.chip {
  flex: 0 0 auto;
  font-size: 13px; font-weight: 600;
  color: var(--text);
  background: var(--glass);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 8px 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  animation: msg-in 0.3s var(--ease-out) both;
}
.chip:hover { border-color: var(--gold); background: var(--gold-soft); }
.chip:active { transform: scale(0.96); }

/* Eingabe */
.composer {
  flex: 0 0 auto;
  display: flex; align-items: flex-end; gap: 8px;
  margin: 0 16px;
  padding: 6px 6px 6px 16px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 24px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.composer:focus-within { border-color: rgba(245, 184, 75, 0.6); box-shadow: 0 0 0 4px rgba(245, 184, 75, 0.12); }
.composer.nudge { animation: nudge 0.35s ease; border-color: var(--magenta); }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.composer textarea {
  flex: 1 1 auto; min-width: 0;
  background: none; border: 0; outline: none;
  color: var(--text);
  font: inherit; line-height: 1.45;
  resize: none;
  padding: 9px 0;
  max-height: 140px;
}
.composer textarea::placeholder { color: var(--muted); opacity: 0.9; }
.send {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 42px; padding: 0 14px 0 16px;
  border-radius: 999px; border: 0;
  cursor: pointer;
  font-weight: 800; font-size: 14px;
  color: #1b1740;
  background: linear-gradient(135deg, #ffd06a, #e39a2a);
  box-shadow: 0 6px 18px rgba(245, 184, 75, 0.3);
  transition: transform 0.15s, filter 0.2s, opacity 0.2s;
}
.send:hover { filter: brightness(1.06); }
.send:active { transform: scale(0.96); }
.send:disabled { opacity: 0.55; cursor: progress; }
@media (max-width: 899px) {
  .send { width: 42px; padding: 0; }
  .send-label { display: none; }
}
.disclaimer {
  flex: 0 0 auto;
  margin: 0;
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 24px; translate: -50% 0;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 13.5px; font-weight: 600;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  z-index: 10;
  animation: toast 2.2s ease both;
}
@keyframes toast {
  0% { opacity: 0; transform: translateY(10px); }
  12%, 85% { opacity: 1; transform: none; }
  100% { opacity: 0; transform: translateY(6px); }
}

/* Weniger Bewegung, wenn gewünscht */
@media (prefers-reduced-motion: reduce) {
  .genie, .genie *, .msg, .chip, .factors tr, .die-chip, .dot, .stage-canvas, .stage-flash, .thinking-line, .composer.nudge {
    animation: none !important;
    transition: none !important;
  }
  .seal { opacity: 1; animation: none; }
  .messages { scroll-behavior: auto; }
}
